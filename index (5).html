<!DOCTYPE html>
<html lang="id" style="color-scheme: light; --a: #3B82F6; --b: #22D3EE; --c: #6366F1;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanzz – Semua Tautan</title>
<style>
:root{
  color-scheme:dark;--bg:#04060D;--ink:#F1F5FF;--muted:#93A3CC;
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.16);
  --a:#3B82F6;--b:#22D3EE;--c:#6366F1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{color-scheme:light;--bg:#EEF3FF;--ink:#0B1230;--muted:#52608F;--glass:rgba(255,255,255,.65);--glass2:rgba(255,255,255,.95);--edge:rgba(20,40,120,.16)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);overflow-x:hidden;font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;justify-content:center;padding:36px 18px;position:relative}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.aurora i:nth-child(1){width:380px;height:380px;background:var(--a);top:-120px;left:-100px}
.aurora i:nth-child(2){width:340px;height:340px;background:var(--c);bottom:-120px;right:-90px}
.aurora i:nth-child(3){width:240px;height:240px;background:var(--b);top:45%;left:60%;opacity:.3}
:root[data-theme="light"] .aurora i{opacity:.35}
main{position:relative;z-index:1;width:100%;max-width:440px;height:max-content;text-align:center;padding:34px 22px 26px;border-radius:32px;background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.ring{width:140px;height:140px;margin:0 auto 20px;border-radius:50%;padding:4px;background:conic-gradient(from 0deg,var(--a),var(--b),#fff,var(--c),var(--a));animation:spin 6s linear infinite;box-shadow:0 0 50px rgba(59,130,246,.55)}
.ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--bg);animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{margin:0;font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(90deg,var(--ink),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.bio{margin:10px auto 26px;max-width:32ch;color:var(--muted);font-size:1rem;line-height:1.55}
#links{display:flex;flex-direction:column;gap:12px}
.empty{color:var(--muted);font-size:.95rem;padding:14px 0}
.link{position:relative;display:flex;align-items:center;gap:16px;width:100%;padding:14px 16px;text-align:left;text-decoration:none;color:var(--ink);background:var(--glass2);border:1px solid var(--edge);border-radius:22px;animation:rise .5s ease both;animation-delay:var(--d,0ms);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.link:hover{transform:translateY(-3px);border-color:var(--g);box-shadow:0 14px 40px -12px var(--g)}
.link:active{transform:scale(.985)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.tile{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--g),var(--a));box-shadow:0 8px 20px -8px var(--g);color:#fff}
.tile svg{width:26px;height:26px;fill:currentColor}
.ri svg{width:22px;height:22px;fill:currentColor}
.chip svg{width:16px;height:16px;fill:currentColor;vertical-align:-3px}
svg.st{fill:none!important;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.txt{display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0}
.txt b{font-size:1.08rem;font-weight:700}
.txt small{color:var(--muted);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--muted);font-size:1.6rem;line-height:1;transition:transform .18s,color .18s}
.link:hover .chev{transform:translateX(3px);color:var(--g)}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.pill{font:inherit;font-weight:600;font-size:.9rem;color:var(--ink);cursor:pointer;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:9px 16px;transition:background .15s}
.pill:hover{background:var(--glass2)}
.pill.go{background:linear-gradient(135deg,var(--a),var(--c));border-color:transparent;color:#fff}
footer{margin-top:20px;font-size:.82rem;color:var(--muted)}
#panel{margin-top:22px;text-align:left;border-top:1px solid var(--edge);padding-top:18px}
#panel[hidden]{display:none}
#panel h2{margin:0 0 10px;font-size:1.05rem}
.f{display:block;width:100%;font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.f::placeholder{color:var(--muted)}
.row{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:10px;margin-bottom:10px}
.rh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rh .ri{font-size:1.3rem;margin-right:auto}
.ib{font:inherit;cursor:pointer;color:var(--ink);background:var(--glass2);border:1px solid var(--edge);border-radius:10px;min-width:36px;height:36px}
.row.off{opacity:.55}
.row .f{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{font:inherit;font-size:.85rem;cursor:pointer;color:var(--ink);background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:7px 12px}
.hint{color:var(--muted);font-size:.84rem;line-height:1.45;margin:10px 0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.92rem;font-weight:600;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.link.feat{background:linear-gradient(135deg,var(--g),var(--a));color:#fff;border-color:transparent}
.link.feat small,.link.feat .chev{color:rgba(255,255,255,.85)}
.link.feat .tile{background:rgba(255,255,255,.22)}
.mod{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px}
.mod[hidden]{display:none}
.card{width:100%;max-width:380px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--edge);border-radius:24px;padding:22px;text-align:left}
.card h2{margin:0 0 12px;font-size:1.1rem}
#qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:16px;margin-bottom:12px}
select.f{appearance:auto}
.sw{display:flex;gap:10px;margin:6px 0 12px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);cursor:pointer}
.sw button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.foot2{margin-top:10px;font-size:.85rem}
.foot2 button{font:inherit;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.ring,.ring img{animation:none}.link{animation:none;transition:none}}
</style>
</head>

function setIcon(n,k){if(I[k])n.innerHTML=I[k];else n.textContent=(P[k]||P.web)[0]}
var ACC=[['#3B82F6','#22D3EE','#6366F1'],['#EC4899','#F472B6','#A855F7'],['#10B981','#34D399','#14B8A6'],['#F59E0B','#FBBF24','#EF4444'],['#8B5CF6','#C084FC','#6366F1']];
var S=JSON.parse($('state').textContent),art=null,dl=null,root=document.documentElement;
function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toast.k);toast.k=setTimeout(function(){t.className=''},2400)}
function render(){
  $('name').textContent=S.name||'';$('bio').textContent=S.bio||'';$('foot').textContent='© 2026 '+(S.name||'');
  document.title=(S.name||'Link')+' – Semua Tautan';
  var ac=ACC[S.acc||0]||ACC[0];root.style.setProperty('--a',ac[0]);root.style.setProperty('--b',ac[1]);root.style.setProperty('--c',ac[2]);
  if(S.photo)document.querySelector('.ring img').src=S.photo;
  var box=$('links');box.textContent='';var n=0;
  S.links.forEach(function(l){
    var u=safe(l.u);if(l.on===false||!u)return;
    var p=P[l.p]||P.web,a=el('a','link');
    a.href=u;a.target='_blank';a.rel='noopener';if(l.f)a.className+=' feat';a.style.setProperty('--g',p[2]);a.style.setProperty('--d',(n++*70)+'ms');
    var x=el('span','txt');x.appendChild(el('b',null,l.t||p[1]));if(l.s)x.appendChild(el('small',null,l.s));
    var tl=el('span','tile');setIcon(tl,P[l.p]?l.p:'web');a.appendChild(tl);a.appendChild(x);a.appendChild(el('span','chev','›'));box.appendChild(a);
  });
  if(!n)box.appendChild(el('div','empty','Belum ada link.'));
}
function inp(v,ph,fn){var i=el('input','f');i.value=v||'';i.placeholder=ph;i.addEventListener('input',function(){fn(i.value);render()});return i}
function btn(t,tt,fn){var b=el('button','ib',t);b.type='button';b.title=tt;b.setAttribute('aria-label',tt);b.addEventListener('click',fn);return b}
function rows(){
  var box=$('rows');box.textContent='';
  S.links.forEach(function(l,i){
    var r=el('div','row'+(l.on===false?' off':'')),h=el('div','rh'),ic=el('span','ri');setIcon(ic,P[l.p]?l.p:'web');
    h.appendChild(ic);
    h.appendChild(btn('↑','Naik',function(){if(i>0){S.links.splice(i-1,0,S.links.splice(i,1)[0]);render();rows()}}));
    h.appendChild(btn('↓','Turun',function(){if(i<S.links.length-1){S.links.splice(i+1,0,S.links.splice(i,1)[0]);render();rows()}}));
    h.appendChild(btn(l.on===false?'🙈':'👁','Tampilkan atau sembunyikan',function(){l.on=l.on===false;render();rows()}));
    h.appendChild(btn(l.f?'★':'☆','Unggulkan',function(){l.f=!l.f;render();rows()}));
    h.appendChild(btn('✕','Hapus',function(){S.links.splice(i,1);render();rows()}));
    r.appendChild(h);
    r.appendChild(inp(l.u,'Link, contoh: tiktok.com/@nama',function(v){l.u=v;var d=detect(v);if(d!==l.p){l.p=d;setIcon(ic,d)}}));
    r.appendChild(inp(l.t,'Judul tombol',function(v){l.t=v}));
    r.appendChild(inp(l.s,'Keterangan kecil (boleh kosong)',function(v){l.s=v}));
    box.appendChild(r);
  });
}
['tiktok','instagram','whatsapp','youtube','telegram','facebook','email','web'].forEach(function(k){
  var c=el('button','chip');setIcon(c,k);c.appendChild(document.createTextNode(' '+P[k][1]));c.type='button';
  c.addEventListener('click',function(){S.links.push({p:k,t:P[k][1],s:'',u:'',on:true});rows();var f=$('rows').querySelectorAll('.row');var i=f[f.length-1].querySelector('input');i.focus();i.scrollIntoView({block:'center'})});
  $('chips').appendChild(c);
});
function sw(){var b=$('sw').children;for(var i=0;i<b.length;i++)b[i].className=(S.acc||0)===i?'on':''}
ACC.forEach(function(c,i){var b=el('button');b.type='button';b.setAttribute('aria-label','Warna '+(i+1));b.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';b.addEventListener('click',function(){S.acc=i;render();sw()});$('sw').appendChild(b)});
$('photoBtn').addEventListener('click',function(){$('photoIn').click()});
$('photoIn').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=420;
    cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,420,420);
    S.photo=cv.toDataURL('image/jpeg',.85);render();toast('Foto diganti, ketuk Simpan')};
    im.onerror=function(){toast('Foto tidak bisa dibaca')};im.src=r.result};
  r.readAsDataURL(f);
});
$('inContact').addEventListener('input',function(e){S.contact=e.target.value});
document.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',function(){b.closest('.mod').hidden=true})});
document.querySelectorAll('.mod').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.hidden=true})});
$('qrBtn').addEventListener('click',function(){
  var q=$('qr');q.textContent='';$('qrUrl').textContent=location.href;
  if(window.QRCode){new QRCode(q,{text:location.href,width:200,height:200})}else q.textContent='QR belum bisa dimuat';
  $('qrMod').hidden=false;
});
$('repBtn').addEventListener('click',function(){$('repMod').hidden=false});
$('repSend').addEventListener('click',function(){
  var m=$('repMsg').value.trim();if(!m){toast('Tulis dulu masalahnya');return}
  var t='Laporan untuk '+(S.name||'halaman ini')+'\nJenis: '+$('repType').value+'\nLink: '+($('repLink').value.trim()||'-')+'\nPesan: '+m;
  var c=(S.contact||'').trim(),url='';
  if(c.indexOf('@')>0)url='mailto:'+c+'?subject='+encodeURIComponent('Laporan halaman link')+'&body='+encodeURIComponent(t);
  else if(/^\+?\d{8,}$/.test(c.replace(/[\s-]/g,'')))url='https://wa.me/'+c.replace(/[^\d]/g,'')+'?text='+encodeURIComponent(t);
  if(url){window.open(url,'_blank','noopener')}
  else{try{navigator.clipboard.writeText(t)}catch(e){}toast('Laporan disalin, kirim ke pemilik halaman')}
  $('repMsg').value='';$('repMod').hidden=true;
});
function buildDoc(){
  var c=root.cloneNode(true);
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
  ['name','bio','links','rows','foot','chips','qr','sw'].forEach(function(i){c.querySelector('#'+i).textContent=''});
  c.querySelector('#panel').hidden=true;c.querySelector('#dl').hidden=false;
  c.querySelector('#toast').className='';c.querySelector('#toast').textContent='';c.removeAttribute('data-theme');c.querySelectorAll('.mod').forEach(function(m){m.hidden=true});
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
$('inName').addEventListener('input',function(e){S.name=e.target.value;render()});
$('inBio').addEventListener('input',function(e){S.bio=e.target.value;render()});
$('editBtn').addEventListener('click',function(){
  var p=$('panel');p.hidden=!p.hidden;
  if(!p.hidden){$('inName').value=S.name||'';$('inBio').value=S.bio||'';$('inContact').value=S.contact||'';sw();rows();p.scrollIntoView({behavior:'smooth'})}
});
$('save').addEventListener('click',async function(){
  S.links=S.links.filter(function(l){return (l.u||'').trim()});
  try{localStorage.setItem('linkpage-state',JSON.stringify(S))}catch(e){}
  render();rows();
  if(art){toast('Menyimpan...');try{await art.publish(buildDoc())}catch(e){toast(e&&e.code==='not_writer'?'Hanya pemilik halaman yang bisa menyimpan':e&&e.code==='conflict'?'Ada perubahan lain, muat ulang halaman':'Gagal menyimpan, coba lagi')}}
  else toast('Tersimpan di perangkat ini');
});
$('dl').addEventListener('click',async function(){
  var doc=buildDoc();
  if(dl){try{await dl.save({filename:'index.html',data:doc});toast('File diunduh')}catch(e){toast('Unduhan dibatalkan')}return}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();toast('File diunduh');
});
$('share').addEventListener('click',function(){
  if(navigator.share){navigator.share({title:document.title,url:location.href}).catch(function(){});return}
  try{navigator.clipboard.writeText(location.href).then(function(){toast('Tautan disalin')})}catch(e){}
});
$('theme').addEventListener('click',function(){root.setAttribute('data-theme',root.getAttribute('data-theme')==='light'?'dark':'light')});
render();
(async function(){
  var own=false;
  try{
    var cl=window.claude;
    if(cl&&cl.use){
      art=await cl.use('artifact');dl=await cl.use('downloads');
      var u=await cl.use('user');own=!!(u&&await u.isOwner());
    }
  }catch(e){}
  $('dl').hidden=false;
  if(!art){try{var s=localStorage.getItem('linkpage-state');if(s){S=JSON.parse(s);render()}}catch(e){}}
  if(own||location.hash==='#edit')$('editBtn').hidden=false;
})();
})();
</script>
